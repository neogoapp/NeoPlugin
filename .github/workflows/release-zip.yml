# Empacota o plugin em neoplugin.zip e publica como asset da Release.
#
# O login do NeoGoApp aponta para
#   https://github.com/neogoapp/NeoPlugin/releases/latest/download/neoplugin.zip
# (asset da última release). Este workflow é quem produz esse zip.
#
# Dois gatilhos:
#   - push de tag vX.Y.Z (o scripts/commit.sh cria) → fluxo normal de release.
#   - workflow_dispatch (botão "Run workflow") → REFAZ o zip da versão atual (lê o
#     VERSION do branch) e ATUALIZA o release dela. Não cria versão nova — versão
#     nova é só via bump/tag. Sem clicar o botão, nada muda no fluxo normal.
#
# O zip leva os arquivos do plugin na RAIZ do zip (.claude-plugin/, skills/,
# .mcp.json, README, LICENSE, VERSION) — a mesma disposição do
# `git clone ... ~/.claude/plugins/neo`. Exclui repo-cruft (.git, .github, scripts).
name: release-zip

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write # criar a Release e anexar o asset

jobs:
  zip-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar o plugin
        run: |
          zip -r neoplugin.zip . \
            -x '.git/*' '.github/*' 'scripts/*' 'neoplugin.zip'

      # Na tag push, a versão é a própria tag. No botão manual (roda de um branch),
      # o ref é o nome do branch — inútil como release —, então tiramos do VERSION.
      - name: Definir a tag do release
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      # Cria o release se ainda não existe (tag nova); se já existe (re-run manual da
      # versão atual), só substitui o zip. Idempotente nos dois gatilhos.
      #
      # `--latest` EXPLÍCITO: sem ele o GitHub decide pela DATA de criação. Em 2026-08-17
      # duas tags foram empurradas juntas, estes jobs rodaram em PARALELO, e o da versão
      # MENOR terminou por último — levando o rótulo "Latest" e, com ele, o link
      # /releases/latest/download/neoplugin.zip que o dashboard e o README usam.
      - name: Publicar/atualizar o release com o zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" neoplugin.zip --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" neoplugin.zip \
              --title "$TAG" \
              --latest \
              --notes "NeoPlugin $TAG — instale via Claude → Customize → Plugins → Add → Upload plugin."
          fi
