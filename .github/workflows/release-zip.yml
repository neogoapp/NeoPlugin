# Packages the plugin into neoplugin.zip and publishes it as a Release asset.
#
# The NeoGoApp sign-in points at
#   https://github.com/neogoapp/NeoPlugin/releases/latest/download/neoplugin.zip
# (the latest release's asset). This workflow is what produces that zip.
#
# Two triggers:
#   - push of a vX.Y.Z tag (created by scripts/commit.sh) → the normal release flow.
#   - workflow_dispatch (the "Run workflow" button) → REBUILDS the current version's zip
#     (reading VERSION from the branch) and UPDATES its release. It does not create a new
#     version — that only happens through bump/tag. Without pressing the button, nothing
#     changes in the normal flow.
#
# The zip carries the plugin's files at its ROOT (.claude-plugin/, skills/, .mcp.json,
# README, LICENSE, VERSION) — the same layout as
# `git clone ... ~/.claude/plugins/neo`. Repo cruft (.git, .github, scripts) is excluded.
name: release-zip

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write # create the Release and attach the asset

jobs:
  zip-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the plugin
        run: |
          zip -r neoplugin.zip . \
            -x '.git/*' '.github/*' 'scripts/*' 'neoplugin.zip'

      # On a tag push the version is the tag itself. On the manual button (which runs from a
      # branch) the ref is the branch name — useless as a release — so we read VERSION.
      - name: Resolve the release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      # Creates the release if it does not exist yet (new tag); if it does (a manual re-run of
      # the current version), it just replaces the zip. Idempotent under both triggers.
      #
      # `--latest` is EXPLICIT: without it GitHub decides by creation DATE. On 2026-08-17 two
      # tags were pushed together, these jobs ran in PARALLEL, and the one for the LOWER
      # version finished last — taking the "Latest" label and, with it, the
      # /releases/latest/download/neoplugin.zip link the dashboard and the README rely on.
      - name: Publish/update the release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" neoplugin.zip --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" neoplugin.zip \
              --title "$TAG" \
              --latest \
              --notes "NeoPlugin $TAG — instale via Claude → Customize → Plugins → Add → Upload plugin."
          fi
